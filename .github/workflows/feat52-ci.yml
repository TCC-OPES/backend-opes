name: FEAT-52 backend checks
on:
  pull_request:
    paths:
      - 'core/**'
      - 'app/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/feat52-ci.yml'
  workflow_dispatch:

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      MODE: DEVELOPMENT
      DEBUG: "True"
      SECRET_KEY: github-actions-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core.tests_recorrencia core.tests_integracao_financeira core.tests_dashboard --verbosity 2
